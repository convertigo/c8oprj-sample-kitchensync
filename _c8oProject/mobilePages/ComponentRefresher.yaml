            - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
            - com.twinsoft.convertigo.beans.common.FormatedContent: 
              →: |
                '		try {
                			setTimeout(function () {
                				var authors = Array.isArray(page.global && page.global.refresherAuthors) ? page.global.refresherAuthors : [
                					"Everyworse",
                					"Nextably",
                					"Givester",
                					"TempleRentr",
                					"Spout",
                					"Frigital",
                					"Batterbus",
                					"Ham Pot",
                					"Bat Plus IQ",
                					"Throbe"
                				];
                				var titles = Array.isArray(page.global && page.global.refresherTitles) ? page.global.refresherTitles : [
                					"Get 50 percent off your purchase today",
                					"Do not miss out on your exclusive deal",
                					"Treat yourself with fresh savings",
                					"Your 25 percent coupon expires at midnight",
                					"Big savings up to 50 percent this week",
                					"Lucky you save today",
                					"The event you do not want to miss",
                					"Special offer see inside",
                					"Ready to order",
                					"Bonus coupon inside"
                				];
                				var messages = Array.isArray(page.global && page.global.refresherMessages) ? page.global.refresherMessages : [
                					"The best brands and the best deals",
                					"Recommended by your personal planner",
                					"Catch them before they are gone",
                					"Shop today to save on gifts",
                					"Offer expires at 11 59 PM",
                					"Free delivery on selected orders",
                					"Selection value and service",
                					"Shop now and save big",
                					"Unlock your coupon code now",
                					"All your favorites are heading your way"
                				];
                				var pickRandom = function (list) {
                					var index = Math.floor(Math.random() * list.length);
                					return list[index];
                				};
                				var createItems = function (count, unread) {
                					var items = [];
                					var total = Number(count || 0);
                					for (var i = 0; i < total; i++) {
                						items.push({
                							unread: unread === true,
                							email: {
                								author: pickRandom(authors),
                								title: pickRandom(titles),
                								message: pickRandom(messages)
                							}
                						});
                					}
                					return items;
                				};
                				var current = Array.isArray(page.global && page.global.refresherItems) ? page.global.refresherItems.slice(0) : [];
                				page.global.refresherItems = createItems(2, true).concat(current);
                				if (event && event.target && typeof event.target.complete === "function") {
                					event.target.complete();
                				}
                				page.ref.markForCheck();
                			}, 1000);
                		} catch (e) {
                			page.c8o.log.debug("[MB] onRefresherRefresh failed", e);
                		} finally {
                			return;
                		}
                '
        comment: Bean onRefresh (ngx.components.UICustomAsyncAction)
