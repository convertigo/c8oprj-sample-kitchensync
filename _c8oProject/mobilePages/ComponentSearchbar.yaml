        ↓handleSearchBarInput [ngx.components.UICustomAsyncAction-1771411942644]: 
          actionValue: 
            - xmlizable: 
              - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
              - com.twinsoft.convertigo.beans.common.FormatedContent: 
                →: |
                  '		try {
                  			var source = Array.isArray(page.global && page.global.searchbarCities) ? page.global.searchbarCities : [];
                  			var value = "";
                  			if (event && event.detail && event.detail.value != null) {
                  				value = String(event.detail.value);
                  			} else if (event && event.target && event.target.value != null) {
                  				value = String(event.target.value);
                  			}
                  			var query = value.toLowerCase();
                  			page.global.searchbarItems = source.filter(function (city) {
                  				return String(city).toLowerCase().indexOf(query) >= 0;
                  			});
                  			page.ref.markForCheck();
                  		} catch (e) {
                  			page.c8o.log.debug("[MB] handleSearchBarInput failed", e);
                  		} finally {
                  			return;
                  		}
                  '
          comment: Bean handleSearchBarInput (ngx.components.UICustomAsyncAction)
