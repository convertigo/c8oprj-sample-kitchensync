    - com.twinsoft.convertigo.beans.common.FormatedContent: 
      →: |
        '/*Begin_c8o_PageImport*/
        /*End_c8o_PageImport*/
        /*Begin_c8o_PageDeclaration*/
        	/*End_c8o_PageDeclaration*/
        /*Begin_c8o_PageConstructor*/
        		/*End_c8o_PageConstructor*/
        /*Begin_c8o_PageFunction*/
        	getFrappeGanttTasksToday() {
        		var now = new Date();
        		var day = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        		var pad = function(n) {
        			return (n < 10 ? ''0'' : '''') + n;
        		};
        		var fmt = function(d) {
        			return d.getFullYear() + ''-'' + pad(d.getMonth() + 1) + ''-'' + pad(d.getDate());
        		};
        		var d0 = new Date(day.getFullYear(), day.getMonth(), day.getDate());
        		var d1 = new Date(day.getFullYear(), day.getMonth(), day.getDate() + 1);
        		var d2 = new Date(day.getFullYear(), day.getMonth(), day.getDate() + 2);
        		var d4 = new Date(day.getFullYear(), day.getMonth(), day.getDate() + 4);
        		return [
        			{id: ''Task 1'', name: ''Planning'', start: fmt(d0), end: fmt(d1), progress: 65},
        			{id: ''Task 2'', name: ''Build'', start: fmt(d1), end: fmt(d4), progress: 30},
        			{id: ''Task 3'', name: ''QA'', start: fmt(d2), end: fmt(d4), progress: 10}
        		];
        	}
        	/*End_c8o_PageFunction*/
        '
