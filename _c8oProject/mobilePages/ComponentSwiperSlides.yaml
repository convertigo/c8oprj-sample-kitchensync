          →: |
            'c8o-slides.swiper-slides-demo {
              display: block;
              margin-top: 12px;
              padding-bottom: 26px;
              --swiper-pagination-bottom: 0px;
              --swiper-pagination-color: var(--ion-color-primary);
              --swiper-pagination-bullet-inactive-color: var(--ion-border-color, #94a3b8);
            }
            
            c8o-slides.swiper-slides-demo swiper-slide {
              border: 1px solid var(--ion-border-color, #cbd5e1);
              border-radius: 14px;
              min-height: 250px;
              padding: 18px;
              box-sizing: border-box;
              display: flex;
              flex-direction: column;
              justify-content: flex-start;
              gap: 10px;
              background: var(--ion-item-background, #ffffff);
            }
            
            c8o-slides.swiper-slides-demo swiper-slide ion-img {
              width: 100%;
              height: 140px;
              border-radius: 10px;
              overflow: hidden;
            }
            
            c8o-slides.swiper-slides-demo swiper-slide h3 {
              margin: 0 0 8px 0;
            }
            
            c8o-slides.swiper-slides-demo swiper-slide p {
              margin: 0;
            }
            '