          →: |
            '		try {
            			if (!page.global) {
            				return;
            			}
            			var names = [
            				"Ada Lovelace",
            				"Alan Turing",
            				"Grace Hopper",
            				"Margaret Hamilton",
            				"Katherine Johnson",
            				"Donald Knuth",
            				"Edsger Dijkstra",
            				"Barbara Liskov"
            			];
            			var list = [];
            			var cursor = 0;
            			var max = 40;
            			var chunk = 8;
            			var initialCount = 14;
            			var addCount = Math.min(initialCount, max);
            			for (var i = 0; i < addCount; i++) {
            				var order = i + 1;
            				list.push({
            					avatar: "https://www.gravatar.com/avatar/" + ((i % 70) + 1) + "?d=monsterid&f=y",
            					name: names[i % names.length] + " #" + order,
            					created: "Loaded item #" + order
            				});
            			}
            			cursor = cursor + addCount;
            			page.global.infiniteNames = names;
            			page.global.infiniteChunkSize = chunk;
            			page.global.infiniteMaxItems = max;
            			page.global.infiniteItems = list;
            			page.global.infiniteCursor = cursor;
            			page.global.infiniteDone = list.length >= max;
            			page.ref.markForCheck();
            		} catch (e) {
            			page.c8o.log.debug("[MB] initInfiniteItems failed", e);
            		} finally {
            			return;
            		}
            '
