        actionValue: 
          - xmlizable: 
            - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
            - com.twinsoft.convertigo.beans.common.FormatedContent: 
              →: |
                '		try {
                			setTimeout(function () {
                				var names = Array.isArray(page.global && page.global.infiniteNames) ? page.global.infiniteNames : [
                					"Ada Lovelace",
                					"Alan Turing",
                					"Grace Hopper",
                					"Margaret Hamilton",
                					"Katherine Johnson",
                					"Donald Knuth",
                					"Edsger Dijkstra",
                					"Barbara Liskov"
                				];
                				var list = Array.isArray(page.global && page.global.infiniteItems) ? page.global.infiniteItems.slice(0) : [];
                				var cursor = Number((page.global && page.global.infiniteCursor) || 0);
                				var max = Number((page.global && page.global.infiniteMaxItems) || 40);
                				var batch = Number((page.global && page.global.infiniteChunkSize) || 8);
                				var remaining = Math.max(0, max - list.length);
                				var addCount = Math.min(batch, remaining);
                				for (var i = 0; i < addCount; i++) {
                					var idx = cursor + i;
                					var order = idx + 1;
                					list.push({
                						avatar: "https://www.gravatar.com/avatar/" + ((idx % 70) + 1) + "?d=monsterid&f=y",
                						name: names[idx % names.length] + " #" + order,
                						created: "Loaded item #" + order
                					});
                				}
                				cursor = cursor + addCount;
                				page.global.infiniteItems = list;
                				page.global.infiniteCursor = cursor;
                				page.global.infiniteDone = list.length >= max;
                				if (event && event.target && typeof event.target.complete === "function") {
                					event.target.complete();
                				}
                				if (event && event.target && page.global && page.global.infiniteDone) {
                					event.target.disabled = true;
                				}
                				page.ref.markForCheck();
                			}, 450);
                		} catch (e) {
                			page.c8o.log.debug("[MB] onInfinite failed", e);
                		} finally {
                			return;
                		}
                '
        comment: Bean onInfinite (ngx.components.UICustomAsyncAction)
