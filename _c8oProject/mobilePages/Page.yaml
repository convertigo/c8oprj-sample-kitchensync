            '.theme-list ion-item,
            .home-list ion-item {
              --padding-start: 14px;
              --inner-padding-end: 14px;
              --transition: none;
            }
            
            .theme-list,
            .home-list {
              padding-bottom: 32px !important;
            }
            
            .home-list {
              padding-top: 0 !important;
            }
            
            .home-filter-searchbar {
              padding: 0 0 4px 0;
            }
            
            .component-icon {
              border-radius: 50%;
              padding: 7px;
              height: 18px;
              width: 18px;
              margin-top: 5px;
              margin-bottom: 5px;
            }
            
            .component-icon-dark {
              background: var(--ion-background-color-step-850, #27323e);
              color: var(--ion-item-background, #fff);
            }
            
            .component-icon-primary {
              background: var(--ion-color-primary);
              color: #fff;
            }
            '
