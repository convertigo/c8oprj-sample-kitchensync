            - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
            - com.twinsoft.convertigo.beans.common.FormatedContent: 
              →: |
                '		try {
                			var value = "";
                			if (event && event.detail && event.detail.value != null) {
                				value = String(event.detail.value);
                			} else if (event && event.target && event.target.value != null) {
                				value = String(event.target.value);
                			}
                			var query = value.toLowerCase().trim();
                			var scope = (event && event.target && event.target.closest) ? event.target.closest("ion-content") : null;
                			var list = scope ? scope.querySelector("ion-list.home-list") : null;
                			var items = list ? list.querySelectorAll("ion-item.home-list-item") : document.querySelectorAll("ion-list.home-list ion-item.home-list-item");
                			for (var i = 0; i < items.length; i++) {
                				var item = items[i];
                				var label = item ? item.querySelector("ion-label") : null;
                				var text = label ? String(label.textContent || "") : "";
                				var show = query === "" || text.toLowerCase().indexOf(query) !== -1;
                				item.style.display = show ? "" : "none";
                			}
                			if (page && page.ref && page.ref.markForCheck) {
                				page.ref.markForCheck();
                			}
                		} catch (e) {
                			page.c8o.log.debug("[MB] home filter failed", e);
                		} finally {
                			return;
                		}
                '
        comment: Bean FilterHomeItems (ngx.components.UICustomAsyncAction)
